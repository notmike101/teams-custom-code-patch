name: Verified draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching package version (for example v1.0.0)
        required: true
        type: string
      build_run_id:
        description: Successful Windows build run whose downloaded artifacts you tested
        required: true
        type: string
      verified:
        description: I downloaded this run's exact setup and portable files and completed the manual QA described in README
        required: true
        default: false
        type: boolean
      setup_sha256:
        description: SHA256 of the exact setup EXE you tested (64 hexadecimal characters)
        required: true
        type: string
      portable_sha256:
        description: SHA256 of the exact portable ZIP you tested (64 hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verified-draft-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    name: Validate and promote existing candidate to draft
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      HUMAN_VERIFIED: ${{ inputs.verified }}
      TESTED_SETUP_SHA256: ${{ inputs.setup_sha256 }}
      TESTED_PORTABLE_SHA256: ${{ inputs.portable_sha256 }}
    steps:
      - name: Validate inputs and freeze existing tag
        id: tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GH_REPO -cne 'notmike101/teams-custom-code-patch') { throw 'Promotion is restricted to the source repository.' }
          if ($env:HUMAN_VERIFIED -cne 'true') { throw 'Exact candidate artifacts must be human-tested first.' }
          if ($env:RELEASE_TAG -cnotmatch '\Av(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\z' -or
              @($env:RELEASE_TAG.Substring(1).Split('.') | Where-Object { [int] $_ -gt 65535 }).Count -gt 0) { throw 'Tag must be v followed by three version components from 0 to 65535.' }
          if ($env:BUILD_RUN_ID -cnotmatch '\A[1-9][0-9]{0,19}\z') { throw 'Invalid build run ID.' }
          foreach ($hash in @($env:TESTED_SETUP_SHA256, $env:TESTED_PORTABLE_SHA256)) {
            if ($hash -notmatch '\A[0-9a-fA-F]{64}\z') { throw 'Both tested SHA256 values are required.' }
          }
          function Get-GhJson([string[]] $Arguments) {
            $json = & gh @Arguments
            if ($LASTEXITCODE -ne 0) { throw 'GitHub API request failed.' }
            return ($json -join "`n" | ConvertFrom-Json)
          }
          $reference = Get-GhJson @('api', "repos/$env:GH_REPO/git/ref/tags/$env:RELEASE_TAG")
          $commit = Get-GhJson @('api', "repos/$env:GH_REPO/commits/$env:RELEASE_TAG")
          if ($reference.ref -cne "refs/tags/$env:RELEASE_TAG" -or $reference.object.sha -cnotmatch '\A[0-9a-f]{40}\z' -or
              $commit.sha -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Unable to resolve the exact existing tag.' }
          "commit=$($commit.sha)" >> $env:GITHUB_OUTPUT
          "object=$($reference.object.sha)" >> $env:GITHUB_OUTPUT
      - name: Check out existing tag without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Validate provenance, download, verify and create draft only
        shell: pwsh
        env:
          TAG_COMMIT: ${{ steps.tag.outputs.commit }}
          TAG_OBJECT: ${{ steps.tag.outputs.object }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-GhJson([string[]] $Arguments) {
            $json = & gh @Arguments
            if ($LASTEXITCODE -ne 0) { throw 'GitHub API request failed.' }
            return ($json -join "`n" | ConvertFrom-Json)
          }
          function Assert-TagUnchanged {
            $reference = Get-GhJson @('api', "repos/$env:GH_REPO/git/ref/tags/$env:RELEASE_TAG")
            $commit = Get-GhJson @('api', "repos/$env:GH_REPO/commits/$env:RELEASE_TAG")
            if ($reference.object.sha -cne $env:TAG_OBJECT -or $commit.sha -cne $env:TAG_COMMIT) { throw 'Tag changed during promotion.' }
          }
          function Assert-NoRelease {
            $pages = Get-GhJson @('api', '--paginate', '--slurp', "repos/$env:GH_REPO/releases?per_page=100")
            foreach ($page in $pages) {
              foreach ($release in $page) {
                if ($release.tag_name -ceq $env:RELEASE_TAG) { throw 'A draft or published release already exists for this tag; nothing will be replaced.' }
              }
            }
          }
          $head = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:TAG_COMMIT) { throw 'Checked-out tag commit does not match the frozen commit.' }
          $tagObject = & git rev-parse "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0 -or $tagObject -cne $env:TAG_OBJECT) { throw 'Checked-out tag object does not match the frozen tag.' }
          Assert-TagUnchanged
          $version = $env:RELEASE_TAG.Substring(1)
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          if ($package.name -cne 'teams-custom-patcher' -or $package.version -cne $version) { throw 'Tag must match the checked-out package version and project.' }
          $repository = Get-GhJson @('api', "repos/$env:GH_REPO")
          $workflow = Get-GhJson @('api', "repos/$env:GH_REPO/actions/workflows/windows-build.yml")
          $run = Get-GhJson @('api', "repos/$env:GH_REPO/actions/runs/$env:BUILD_RUN_ID")
          if ($repository.full_name -cne $env:GH_REPO -or $run.repository.id -ne $repository.id -or
              $run.repository.full_name -cne $env:GH_REPO -or $run.head_repository.id -ne $repository.id -or
              [string] $run.id -cne $env:BUILD_RUN_ID -or $run.workflow_id -ne $workflow.id -or
              $workflow.path -cne '.github/workflows/windows-build.yml' -or $run.path -cne '.github/workflows/windows-build.yml' -or
              $run.status -cne 'completed' -or $run.conclusion -cne 'success' -or
              $run.event -cnotin @('push', 'workflow_dispatch') -or $run.head_sha -cne $env:TAG_COMMIT) {
            throw 'Run must be a successful non-PR Windows build in this repository at the exact tagged commit.'
          }
          Assert-NoRelease
          $pages = Get-GhJson @('api', '--paginate', '--slurp', "repos/$env:GH_REPO/actions/runs/$env:BUILD_RUN_ID/artifacts?per_page=100")
          $artifacts = @($pages | ForEach-Object { $_.artifacts } | Where-Object { $_.name -ceq 'teams-custom-windows-x64' })
          if ($artifacts.Count -ne 1 -or $artifacts[0].expired -ne $false -or
              $artifacts[0].workflow_run.id -ne $run.id -or $artifacts[0].workflow_run.head_sha -cne $env:TAG_COMMIT) {
            throw 'Exactly one unexpired candidate artifact from the specified build is required.'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'verified-release-assets'
          if (Test-Path -LiteralPath $destination) { throw 'Artifact destination already exists.' }
          & gh run download $env:BUILD_RUN_ID --repo $env:GH_REPO --name teams-custom-windows-x64 --dir $destination
          if ($LASTEXITCODE -ne 0) { throw 'Exact build artifact download failed.' }
          $setup = "TeamsCustom-$version-windows-x64-setup.exe"
          $portable = "TeamsCustom-$version-windows-x64-portable.zip"
          $expected = @($setup, $portable, 'SHA256SUMS')
          $entries = @(Get-ChildItem -LiteralPath $destination -Force)
          if ($entries.Count -ne 3) { throw 'Artifact must contain exactly setup, portable and SHA256SUMS.' }
          foreach ($entry in $entries) {
            if ($entry.PSIsContainer -or $entry.Name -cnotin $expected -or
                ($entry.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Unexpected artifact entry.' }
          }
          $setupHash = (Get-FileHash -LiteralPath (Join-Path $destination $setup) -Algorithm SHA256).Hash.ToLowerInvariant()
          $portableHash = (Get-FileHash -LiteralPath (Join-Path $destination $portable) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($setupHash -cne $env:TESTED_SETUP_SHA256.ToLowerInvariant() -or
              $portableHash -cne $env:TESTED_PORTABLE_SHA256.ToLowerInvariant()) { throw 'Artifacts differ from the exact files the human tested.' }
          # Compare a canonical manifest rather than accepting any manifest-supplied paths.
          $manifest = [IO.File]::ReadAllText((Join-Path $destination 'SHA256SUMS'))
          if ($manifest -cne "$setupHash  $setup`n$portableHash  $portable`n") { throw 'SHA256SUMS is not the exact two-file checksum manifest.' }
          Assert-TagUnchanged
          Assert-NoRelease
          $notes = @(
            'Unsigned Windows x64 artifacts; no automatic update support.',
            "Human verification attested for the exact artifact from https://github.com/$env:GH_REPO/actions/runs/$env:BUILD_RUN_ID.",
            "Source commit: $env:TAG_COMMIT; candidate artifact ID: $($artifacts[0].id).",
            "Setup SHA256: $setupHash",
            "Portable SHA256: $portableHash",
            'Review the manual QA record and README limitations before publishing this draft. This attestation is not independent CI proof of live Teams or a clean VM.'
          ) -join "`n"
          $notesPath = Join-Path $env:RUNNER_TEMP 'verified-release-notes.txt'
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          & gh release create $env:RELEASE_TAG (Join-Path $destination $setup) (Join-Path $destination $portable) (Join-Path $destination 'SHA256SUMS') --repo $env:GH_REPO --draft --verify-tag --title "Teams Custom $env:RELEASE_TAG" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed; inspect GitHub for a partial draft before retrying.' }
